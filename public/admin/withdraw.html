<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Saldo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    background: #f5f7fb;
    font-family: "Segoe UI", sans-serif;
}

.vp-content {
    margin-left: 260px;
    padding: 30px;
}

.vp-card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    max-width: 520px;
}

.balance-box {
    background: linear-gradient(135deg, #0d6efd, #4da3ff);
    color: white;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    margin-bottom: 20px;
}

.ewallet-option {
    display: flex;
    gap: 10px;
    border: 2px solid #eee;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 10px;
    align-items: center;
    transition: 0.2s;
}

.ewallet-option:hover {
    border-color: #0d6efd;
    background: #f0f6ff;
}

.ewallet-option input {
    margin-right: 10px;
}

.btn-withdraw {
    width: 100%;
    border-radius: 10px;
    padding: 12px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="vp-wrapper">

<!-- SIDEBAR KAMU -->
<nav class="vp-sidebar" id="vpSidebar">
    <div class="vp-sidebar-header">
        <img src="/media/logo.png" class="vp-sidebar-header-logo">
        <a class="vp-sidebar-brand-text" href="/dashboard">Riky Shop</a>
    </div>

    <div class="vp-sidebar-menu">
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-house-door-fill"></i> Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/deposit"><i class="bi bi-wallet2"></i> Deposit</a></li>
            <li class="nav-item"><a class="nav-link active" href="/withdraw"><i class="bi bi-arrow-down-circle-fill"></i> Withdraw</a></li>
            <li class="nav-item"><a class="nav-link" href="/order"><i class="bi bi-cart-check-fill"></i> Order</a></li>
        </ul>
    </div>
</nav>

<!-- CONTENT -->
<div class="vp-content">
<div class="vp-card">

<h4 class="mb-3">Withdraw Saldo</h4>

<div class="balance-box">
Saldo Anda
<h3>Rp <%= saldo.toLocaleString("id-ID") %></h3>
</div>

<form id="withdrawForm">

<label class="form-label">Pilih E-Wallet</label>

<label class="ewallet-option">
<input type="radio" name="metode" value="DANA" checked>
<i class="bi bi-wallet-fill text-primary"></i> DANA
</label>

<label class="ewallet-option">
<input type="radio" name="metode" value="OVO">
<i class="bi bi-wallet-fill text-purple"></i> OVO
</label>

<label class="ewallet-option">
<input type="radio" name="metode" value="SHOPEEPAY">
<i class="bi bi-wallet-fill text-warning"></i> ShopeePay
</label>

<label class="ewallet-option">
<input type="radio" name="metode" value="GOPAY">
<i class="bi bi-wallet-fill text-success"></i> GoPay
</label>

<div class="mb-3 mt-3">
<label class="form-label">Nomor Tujuan</label>
<input type="text" name="tujuan" class="form-control" placeholder="08xxxxxxxxxx" required>
</div>

<div class="mb-3">
<label class="form-label">Nominal Withdraw</label>
<input type="number" name="nominal" class="form-control" placeholder="Minimal 10.000" required>
</div>

<button class="btn btn-primary btn-withdraw">Proses Withdraw</button>

</form>

<div id="result" class="mt-3"></div>

</div>
</div>
</div>

<script>
document.getElementById("withdrawForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    const data = {
        metode: formData.get("metode"),
        tujuan: formData.get("tujuan"),
        nominal: formData.get("nominal")
    };

    const res = await fetch("/withdraw/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    const result = await res.json();

    document.getElementById("result").innerHTML =
        `<div class="alert alert-info">${result.message}</div>`;
});
</script>

</body>
</html>
