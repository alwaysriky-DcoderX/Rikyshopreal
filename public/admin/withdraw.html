<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Saldo - Riky Shop</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root{
--primary:#0d6efd;
--bg:#f5f7fb;
--radius:16px;
}

body{
background:var(--bg);
font-family:"Segoe UI",sans-serif;
margin:0;
}

/* CONTAINER */
.container-box{
max-width:520px;
margin:auto;
padding:20px;
}

/* CARD */
.card-box{
background:white;
border-radius:var(--radius);
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

/* SALDO */
.balance-box{
background:linear-gradient(135deg,#0d6efd,#4da3ff);
color:white;
border-radius:14px;
padding:20px;
text-align:center;
margin-bottom:25px;
}

.balance-box h3{
margin:5px 0 0;
font-weight:700;
}

/* OPTION */
.option{
display:flex;
align-items:center;
gap:10px;
border:2px solid #eee;
padding:14px;
border-radius:12px;
cursor:pointer;
margin-bottom:10px;
transition:.2s;
}

.option:hover{
border-color:var(--primary);
background:#f0f6ff;
}

.option input{
transform:scale(1.2);
}

/* BUTTON */
.btn-primary{
border-radius:12px;
padding:14px;
font-weight:600;
}

/* SUCCESS ANIMATION */
.success-box{
display:none;
text-align:center;
padding:20px;
animation:fadeIn .4s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1}
}
</style>
</head>

<body>

<div class="container-box">
<div class="card-box">

<h4 class="mb-3">Withdraw Saldo</h4>

<div class="balance-box">
Saldo Anda
<h3 id="saldoText">Rp 0</h3>
</div>

<form id="withdrawForm">

<label class="fw-semibold mb-2">Pilih Metode</label>

<div class="mb-2 text-muted small">E-Wallet</div>

<label class="option">
<input type="radio" name="metode" value="DANA" checked>
<i class="bi bi-wallet-fill text-primary"></i> DANA
</label>

<label class="option">
<input type="radio" name="metode" value="OVO">
<i class="bi bi-wallet-fill text-danger"></i> OVO
</label>

<label class="option">
<input type="radio" name="metode" value="GOPAY">
<i class="bi bi-wallet-fill text-success"></i> GoPay
</label>

<label class="option">
<input type="radio" name="metode" value="SHOPEEPAY">
<i class="bi bi-wallet-fill text-warning"></i> ShopeePay
</label>

<div class="mt-3 mb-2 text-muted small">Bank</div>

<label class="option">
<input type="radio" name="metode" value="BCA">
<i class="bi bi-bank"></i> Bank BCA
</label>

<label class="option">
<input type="radio" name="metode" value="BRI">
<i class="bi bi-bank"></i> Bank BRI
</label>

<label class="option">
<input type="radio" name="metode" value="MANDIRI">
<i class="bi bi-bank"></i> Bank Mandiri
</label>

<div class="mt-3">
<label class="form-label">Nomor Tujuan</label>
<input type="text" name="tujuan" class="form-control form-control-lg" placeholder="08xxxxxxxxxx / nomor rekening" required>
</div>

<div class="mt-3">
<label class="form-label">Nominal Withdraw</label>
<input type="number" name="nominal" class="form-control form-control-lg" min="10000" placeholder="Minimal 10.000" required>
</div>

<button class="btn btn-primary w-100 mt-4">
<i class="bi bi-send"></i> Proses Withdraw
</button>

</form>

<div id="result" class="mt-3"></div>

<div id="successBox" class="success-box">
<i class="bi bi-check-circle-fill text-success" style="font-size:48px"></i>
<h5 class="mt-2">Withdraw berhasil dibuat</h5>
</div>

</div>
</div>

<script>
async function loadSaldo(){
  try{
    const res = await fetch("/user/me")
    const json = await res.json()
    if(json.success){
      document.getElementById("saldoText").innerText =
        "Rp " + Number(json.saldo).toLocaleString("id-ID")
    }
  }catch(e){
    console.log("Gagal ambil saldo")
  }
}

loadSaldo()

function validasiNomor(metode, nomor){
  if(metode==="BCA"||metode==="BRI"||metode==="MANDIRI"){
    return nomor.length >= 8
  }
  return nomor.startsWith("08") && nomor.length >= 10
}

document.getElementById("withdrawForm").addEventListener("submit", async function(e){
e.preventDefault()

const formData=new FormData(this)
const metode=formData.get("metode")
const tujuan=formData.get("tujuan")
const nominal=parseInt(formData.get("nominal"))

if(!validasiNomor(metode, tujuan)){
document.getElementById("result").innerHTML=
`<div class="alert alert-danger">Nomor tujuan tidak valid</div>`
return
}

const btn=this.querySelector("button")
btn.disabled=true
btn.innerHTML="Memproses..."

try{
const res=await fetch("/withdraw/create",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({metode, tujuan, nominal})
})

const result=await res.json()

if(result.success){
document.getElementById("successBox").style.display="block"
document.getElementById("result").innerHTML=""
document.getElementById("saldoText").innerText =
"Rp " + result.saldo.toLocaleString("id-ID")
this.reset()
}else{
document.getElementById("result").innerHTML=
`<div class="alert alert-danger">${result.message}</div>`
}

}catch(err){
document.getElementById("result").innerHTML=
`<div class="alert alert-danger">Server error</div>`
}

btn.disabled=false
btn.innerHTML="Proses Withdraw"
})
</script>

</body>
</html>
